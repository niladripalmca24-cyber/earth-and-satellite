services:
  - type: web
    name: earthorbit-3d
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=*, autoplay=*, camera=*, display-capture=*, fullscreen=*, geolocation=*, gyroscope=*, microphone=*"
